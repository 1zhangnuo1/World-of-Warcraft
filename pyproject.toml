[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "navigation-lab"
version = "0.1.0"
description = "Independent navigation simulator with replaceable navigation and motion adapters"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["pygame-ce>=2.5.6,<3"]

[project.scripts]
navigation-lab = "navigation_lab.app:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "pyinstaller>=6.12,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/navigation_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/navigation_lab"]
